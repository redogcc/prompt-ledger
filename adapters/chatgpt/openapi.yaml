openapi: 3.1.0
info:
  title: Prompt Ledger ingest
  version: 1.0.0
  description: >-
    Local Prompt Ledger bridge. Replace the server URL with the HTTPS tunnel or
    reverse proxy that reaches this machine. The token is shown in the plugin's
    Connect tab. Data is written to local SQLite and never sent to a third-party
    archive.
servers:
  - url: https://YOUR-TUNNEL-OR-REVERSE-PROXY.example.com
    description: Local bridge, exposed through your own HTTPS tunnel.
paths:
  /prompt-ledger/v1/ingest:
    post:
      operationId: logPrompt
      summary: Archive one finished ChatGPT turn
      description: >-
        Call once per completed turn. Send the user prompt and final assistant
        answer verbatim. Omit token fields when ChatGPT does not expose them.
        Retries are idempotent when source_key is stable.
      security:
        - PromptLedgerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogPromptRequest'
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPromptResponse'
        '401':
          description: Invalid ingest token
components:
  securitySchemes:
    PromptLedgerToken:
      type: apiKey
      in: header
      name: x-prompt-ledger-token
  schemas:
    LogPromptRequest:
      type: object
      additionalProperties: false
      required:
        - platform
        - prompt
      properties:
        platform:
          type: string
          const: chatgpt
        prompt:
          type: string
          description: Complete user prompt, verbatim.
        response:
          type: string
          description: Final assistant answer, verbatim.
        model:
          type: string
          description: Model slug, for example gpt-5.
        provider:
          type: string
          const: openai
        status:
          type: string
          enum: [completed, failed, aborted, interrupted]
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        duration_ms:
          type: integer
          minimum: 0
        conversation_id:
          type: string
        source_key:
          type: string
          description: Stable conversation/message id for idempotent retries.
        tools:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              category:
                type: string
                enum: [tool, skill, mcp]
              status:
                type: string
                enum: [ok, error]
              error:
                type: string
        tags:
          type: array
          items:
            type: string
    LogPromptResponse:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
        duplicate:
          type: boolean
        autoScore:
          type: number
